# AkramCode Docker gateway. See docs/user-guide/docker.md.
# Usage: AKRAMCODE_UID=$(id -u) AKRAMCODE_GID=$(id -g) docker compose up -d
services:
  gateway:
    build: .
    image: akram-code
    container_name: akramcode
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/.akramcode:/opt/data
    environment:
      # Docker runtime compatibility names; values come from AkramCode env.
      - AKRAMCODE_UID=${AKRAMCODE_UID:-10000}
      - AKRAMCODE_GID=${AKRAMCODE_GID:-10000}
      # API access: configure both values and keep the server behind auth.
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Optional messaging credentials: see docs/user-guide/docker.md.
    command: ["gateway", "run"]
