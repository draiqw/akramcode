description: The AkramCode desktop app in your browser. `akramcode workbench` serves the desktop interface through the AkramCode dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `akramcode workbench` run and again after each AkramCode update it runs `npm install --ignore-scripts` (guided by AkramCode's lockfile) and Vite against your AkramCode checkout's desktop sources, writing only under ~/.akramcode/akramcode-workbench and its own plugin dir (the checkout is only read), and starts `akramcode dashboard` on loopback when none is running.
maintainer: sxuff
