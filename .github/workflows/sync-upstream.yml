name: Sync Hermes upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out local main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git remotes
        run: git remote add upstream https://github.com/NousResearch/hermes-agent.git || true

      - name: Fetch upstream main
        run: git fetch --no-tags --depth=1 upstream main

      - name: Prepare upstream PR
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(git rev-parse upstream/main)"
          if git diff --quiet HEAD upstream/main; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="upstream-sync/${upstream_sha:0:12}"
          git switch -c "$branch"
          git diff --name-only --diff-filter=D HEAD upstream/main | xargs -r git rm -f --
          git checkout upstream/main -- .
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: sync Hermes upstream ${upstream_sha:0:12}"
          git push --set-upstream origin "$branch"

          title="chore: sync Hermes upstream ${upstream_sha:0:12}"
          body=$(cat <<EOF
          This PR brings changes from [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent) into `main`.

          Upstream commit: `$upstream_sha`

          Review conflicts and project-specific harness changes before merging.
          EOF
          )
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
        env:
          GH_TOKEN: ${{ github.token }}
